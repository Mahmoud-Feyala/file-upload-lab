<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Upload Lab</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --line: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #f87171;
      --safe: #34d399;
      --accent: #60a5fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #111827 50%, #1e293b);
      color: var(--text);
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .app {
      width: min(780px, 100%);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .header {
      padding: 18px 22px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .badge {
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: bold;
      background: rgba(96, 165, 250, 0.15);
      color: var(--accent);
      border: 1px solid rgba(96,165,250,0.4);
    }

    .content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 0;
    }

    .panel {
      padding: 26px 22px;
      border-right: 1px solid var(--line);
    }

    .panel:last-child {
      border-right: none;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      margin-bottom: 18px;
    }

    button {
      background: var(--accent);
      color: #08111f;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      filter: brightness(1.05);
    }

    .samples {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sample {
      background: transparent;
      border: 1px dashed var(--line);
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 6px;
      width: auto;
      font-size: 0.8rem;
    }

    .summary {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.92rem;
    }

    .summary ul {
      margin: 12px 0 0 18px;
      padding: 0;
    }

    .result {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      background: rgba(148, 163, 184, 0.05);
      border: 1px solid var(--line);
      min-height: 80px;
      color: var(--text);
      white-space: pre-wrap;
    }

    .result.error {
      border-color: rgba(248, 113, 113, 0.6);
      background: rgba(127, 29, 29, 0.2);
      color: #fecaca;
    }

    .result.success {
      border-color: rgba(52, 211, 153, 0.6);
      background: rgba(6, 78, 59, 0.18);
      color: #d1fae5;
    }

    .files-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .files-list li {
      padding: 10px 12px;
      background: rgba(148, 163, 184, 0.04);
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .content {
        grid-template-columns: 1fr;
      }

      .panel {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .panel:last-child {
        border-bottom: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>File Upload Lab</h1>
      <span class="badge" id="modeLabel">loading…</span>
    </div>

    <div class="content">
      <div class="panel">
        <form id="uploadForm">
          <label for="uploadFile">Choose a file</label>
          <input id="uploadFile" name="uploadFile" type="file" accept=".png,.jpg,.jpeg,.gif,.webp,image/png,image/jpeg,image/gif,image/webp" />
          <button type="submit">Upload</button>
        </form>

        <div class="samples">
          <button class="sample" type="button" data-file="shell.php">shell.php</button>
          <button class="sample" type="button" data-file="payload.jsp">payload.jsp</button>
          <button class="sample" type="button" data-file="avatar.png">avatar.png</button>
        </div>

        <div id="result" class="result">No upload attempted yet.</div>
      </div>

      <div class="panel">
        <div class="summary">
          <strong>What this lab shows</strong>
          <ul>
            <li>Unsafe uploads trust the original filename and content.</li>
            <li>Safe uploads enforce allowed extensions and content checks.</li>
            <li>Files are stored with random names and limited validation.</li>
          </ul>
        </div>

        <div style="margin-top: 22px;">
          <strong>Uploaded files</strong>
          <ul id="filesList" class="files-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    const modeLabel = document.getElementById('modeLabel');
    const filesList = document.getElementById('filesList');
    const uploadForm = document.getElementById('uploadForm');
    const uploadFile = document.getElementById('uploadFile');
    const resultBox = document.getElementById('result');

    function setMode() {
      fetch('/mode')
        .then(r => r.json())
        .then(data => {
          modeLabel.textContent = data.mode === 'vulnerable' ? 'Vulnerable mode' : 'Safe mode';
          modeLabel.style.color = data.mode === 'vulnerable' ? '#fca5a5' : '#86efac';
          modeLabel.style.borderColor = data.mode === 'vulnerable' ? 'rgba(248,113,113,0.5)' : 'rgba(52,211,153,0.5)';
          modeLabel.style.background = data.mode === 'vulnerable' ? 'rgba(127,29,29,0.25)' : 'rgba(6,78,59,0.2)';
        })
        .catch(() => {
          modeLabel.textContent = 'Mode unavailable';
        });
    }

    function listFiles() {
      fetch('/files')
        .then(r => r.json())
        .then(data => {
          filesList.innerHTML = '';
          if (!data.files || !data.files.length) {
            filesList.innerHTML = '<li>No uploads yet.</li>';
            return;
          }

          data.files.forEach(file => {
            const li = document.createElement('li');
            li.textContent = file;
            filesList.appendChild(li);
          });
        })
        .catch(() => {
          filesList.innerHTML = '<li>Could not load uploaded files.</li>';
        });
    }

    uploadForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = uploadFile.files[0];
      if (!file) {
        resultBox.textContent = 'Please choose a file first.';
        resultBox.className = 'result error';
        return;
      }

      const formData = new FormData();
      formData.append('uploadFile', file);

      resultBox.textContent = 'Uploading...';
      resultBox.className = 'result';

      try {
        const response = await fetch('/upload', {
          method: 'POST',
          body: formData
        });

        const text = await response.text();
        let payload = text;

        try {
          payload = JSON.parse(text);
        } catch (err) {
          payload = { message: text };
        }

        if (!response.ok) {
          resultBox.textContent = payload.message || payload.error || 'Upload failed.';
          resultBox.className = 'result error';
          return;
        }

        resultBox.textContent = JSON.stringify(payload, null, 2);
        resultBox.className = 'result success';
        listFiles();
      } catch (error) {
        resultBox.textContent = 'Request failed: ' + error.message;
        resultBox.className = 'result error';
      }
    });

    document.querySelectorAll('.sample').forEach(button => {
      button.addEventListener('click', () => {
        const fileName = button.dataset.file;
        const input = document.createElement('input');
        input.type = 'file';
        input.name = 'uploadFile';
        input.accept = '.png,.jpg,.jpeg,.gif,.webp,image/png,image/jpeg,image/gif,image/webp,.php,.jsp';
        const fakeFile = new File(['demo-content'], fileName, { type: fileName.endsWith('.png') ? 'image/png' : fileName.endsWith('.php') ? 'application/x-php' : 'application/octet-stream' });
        const dt = new DataTransfer();
        dt.items.add(fakeFile);
        uploadFile.files = dt.files;
      });
    });

    setMode();
    listFiles();
  </script>
</body>
</html>
